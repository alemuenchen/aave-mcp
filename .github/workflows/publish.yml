name: publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - run: npm ci

      - run: npm run build

      # Auth via npm Trusted Publishing (OIDC). The id-token: write
      # permission above lets npm exchange the GitHub OIDC token for a
      # short-lived publish credential. No long-lived NPM_TOKEN needed.
      - run: npm publish --access public --provenance
