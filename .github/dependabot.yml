version: 2
updates:
  # npm dependencies (most important: @bgd-labs/aave-address-book gets
  # bumped whenever AAVE governance approves a new deployment).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"

  # GitHub Actions versions. Low-noise, monthly is plenty.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
